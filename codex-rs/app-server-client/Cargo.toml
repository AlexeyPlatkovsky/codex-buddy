[package]
name = "codex-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[features]
default = ["full-runtime-extensions"]
coding-runtime-extensions = ["codex-app-server/coding-runtime-extensions"]
code-mode = ["codex-app-server/code-mode", "codex-core/code-mode"]
detached-review = ["codex-app-server/detached-review"]
full-runtime-extensions = [
    "coding-runtime-extensions",
    "codex-app-server/full-runtime-extensions",
    "code-mode",
    "codex-core/plugins",
    "detached-review",
    "queue",
    "realtime",
]
queue = ["codex-app-server/queue"]
realtime = ["codex-app-server/realtime", "codex-core/realtime"]

[dependencies]
codex-app-server = { path = "../app-server", default-features = false }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
codex-config = { workspace = true }
codex-core = { workspace = true }
codex-exec-server = { workspace = true }
codex-feedback = { workspace = true }
codex-protocol = { workspace = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
